<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Refresher</title>
        <link rel="stylesheet" href="assets/styles/main.css" />
        <meta charset="UTF-8" />
        <!-- defer is used so the scripts is only loaded after the page fully loads -->
         <!-- type="module", makes sure it treats our js file as module, which will unlock the import syntax and allow us
          to, for instance, import script a into script b. Such as importing an util js file inside the scripts file -->
        <script src="./assets/scripts/app.js" type="module" defer/>
    </head>

    <body>
        <header>
            <img src="assets/images/js-logo-xs.png" alt="JavaScript logo" />
            <h1>JavaScript Refresher</h1>
        </header>

        <ul>
            <li>Base Syntax & Rules</li>
            <li>Variables, Values & Operators</li>
            <li>Functions</li>
            <li>Objects</li>
            <li>Arrays</li>
            <li>Control Structures</li>
            <li>Browser APIs & The DOM</li>
            <li>Essential Features Used By React</li>
            <li>Tricky Parts</li>
        </ul>
    </body>
</html>
